<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | LED Control</title>
    <style>
        :root { color-scheme: light; font-family: Georgia, serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #e7efe9; color: #19352b; }
        main { width: min(100%, 430px); padding: 42px; background: #fffdf8; border: 1px solid #bfd1c4; box-shadow: 12px 12px 0 #a9c2b0; }
        h1 { margin: 0 0 10px; font-size: 2.35rem; letter-spacing: 0; }
        p { line-height: 1.5; }
        form { margin-top: 28px; }
        label { display: block; margin: 18px 0 7px; font-family: sans-serif; font-size: .85rem; font-weight: 700; }
        input { width: 100%; padding: 13px 14px; border: 1px solid #91ac9a; background: #f4f8f4; color: #19352b; font: 1rem sans-serif; }
        input:focus { outline: 3px solid #f0b45b; outline-offset: 2px; }
        ul.errorlist { padding: 0; color: #a64032; font: .85rem sans-serif; list-style: none; }
        button { width: 100%; margin-top: 16px; padding: 14px; border: 0; background: #d96f45; color: white; cursor: pointer; font: 700 .95rem sans-serif; }
        a { color: #a64032; font-weight: 700; }
        @media (max-width: 480px) { main { padding: 30px 24px; box-shadow: 7px 7px 0 #a9c2b0; } }
    </style>
</head>
<body>
    <main>
        <h1>Welcome back</h1>
        <p>Log in to control your LEDs.</p>
        {% if form.non_field_errors %}
            <div role="alert">{{ form.non_field_errors }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
            {{ form.as_p }}
            <button type="submit">Log in</button>
        </form>
        <p>New here? <a href="{% url 'register' %}">Create an account</a></p>
    </main>
</body>
</html>
